<!DOCTYPE html>
<!-- Musafir restaurant website: Messages and reviews page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages and reviews | Musafir</title>
  <!-- Google Fonts: Fraunces for headings, Nunito Sans for text -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS and Bootstrap icons (from CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Our own styles (palette and small helpers) -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-admin="yes">
  <!-- ===== ADMIN TOP BAR ===== -->
  <nav class="navbar navbar-dark bg-md px-3">
    <!-- Menu button: opens the sidebar on phones -->
    <button class="btn btn-outline-light d-md-none" data-bs-toggle="offcanvas" data-bs-target="#side"><i class="bi bi-list"></i></button>
    <span class="navbar-brand mb-0">Musafir admin</span>
    <a class="btn btn-s btn-sm" href="#" onclick="adminLogout()">Log out</a>
  </nav>
  <div class="container-fluid"><div class="row">
    <!-- ===== ADMIN SIDEBAR (becomes a slide-out menu on phones) ===== -->
    <div class="offcanvas-md offcanvas-start col-md-3 col-lg-2 bg-md side p-0" id="side">
      <div class="pt-3">
        <a class="" href="admin-dashboard.html">Dashboard</a>
        <a class="" href="admin-menu.html">Menu items</a>
        <a class="" href="admin-reservations.html">Reservations</a>
        <a class=" active" href="admin-messages.html">Messages and reviews</a>
      </div>
    </div>
    <!-- ===== PAGE CONTENT ===== -->
    <main class="col-md-9 col-lg-10 p-3 p-md-4">
      <h1 class="h3 text-m mb-3">Messages and reviews</h1>
      <!-- Contact messages from the Contact page -->
      <div class="card mb-4">
        <div class="card-header bg-white fw-semibold">Contact messages</div>
        <div class="table-responsive"><table class="table align-middle mb-0">
          <thead><tr><th>From</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="msgList"></tbody>
        </table></div>
      </div>
      <!-- Customer reviews waiting for approval -->
      <div class="card">
        <div class="card-header bg-white fw-semibold">Customer reviews</div>
        <div class="table-responsive"><table class="table align-middle mb-0">
          <thead><tr><th>Name</th><th>Rating</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="adminReviewList"></tbody>
        </table></div>
      </div>
      <!-- Message popup (Bootstrap modal) opened by the View button -->
      <div class="modal fade" id="viewMsg" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><b id="msgTitle">Message</b><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="msgBody"></div>
      </div></div></div>
    </main>
  </div></div>

  <!-- Bootstrap's script file (mobile menu, tabs, popup, collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own JavaScript: makes the pages dynamic -->
  <script src="js/script.js"></script>
</body>
</html>
