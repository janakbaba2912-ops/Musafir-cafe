<!DOCTYPE html>
<!-- Musafir restaurant website: Menu items page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu items | Musafir</title>
  <!-- Google Fonts: Fraunces for headings, Nunito Sans for text -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS and Bootstrap icons (from CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Our own styles (palette and small helpers) -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-admin="yes">
  <!-- ===== ADMIN TOP BAR ===== -->
  <nav class="navbar navbar-dark bg-md px-3">
    <!-- Menu button: opens the sidebar on phones -->
    <button class="btn btn-outline-light d-md-none" data-bs-toggle="offcanvas" data-bs-target="#side"><i class="bi bi-list"></i></button>
    <span class="navbar-brand mb-0">Musafir admin</span>
    <a class="btn btn-s btn-sm" href="#" onclick="adminLogout()">Log out</a>
  </nav>
  <div class="container-fluid"><div class="row">
    <!-- ===== ADMIN SIDEBAR (becomes a slide-out menu on phones) ===== -->
    <div class="offcanvas-md offcanvas-start col-md-3 col-lg-2 bg-md side p-0" id="side">
      <div class="pt-3">
        <a class="" href="admin-dashboard.html">Dashboard</a>
        <a class=" active" href="admin-menu.html">Menu items</a>
        <a class="" href="admin-reservations.html">Reservations</a>
        <a class="" href="admin-messages.html">Messages and reviews</a>
      </div>
    </div>
    <!-- ===== PAGE CONTENT ===== -->
    <main class="col-md-9 col-lg-10 p-3 p-md-4">
      <div class="d-flex justify-content-between mb-3">
        <h1 class="h3 text-m">Menu items</h1>
        <!-- Shows or hides the form below (Bootstrap collapse) -->
        <button class="btn btn-m" data-bs-toggle="collapse" data-bs-target="#addForm" onclick="resetItemForm()">+ Add item</button>
      </div>
      <!-- Add or edit form. Later, set action to a server file (for example save_item.php) -->
      <form class="card p-3 mb-3 collapse" id="addForm">
        <h2 class="h5">Add or edit item</h2>
        <input type="hidden" name="editId" value="">
        <div class="row">
          <div class="col-md-6"><div class="mb-3"><label class="form-label">Item name</label><input class="form-control" type="text" name="item_name" placeholder=""  required></div></div>
          <div class="col-md-6"><label class="form-label">Category</label><select class="form-select mb-3" name="category"><option>Starters</option><option>Main course</option><option>Desserts</option><option>Drinks</option></select></div>
          <div class="col-md-6"><div class="mb-3"><label class="form-label">Price</label><input class="form-control" type="number" name="price" placeholder="" min="1" required></div></div>
          <div class="col-md-6"><label class="form-label">Type</label><select class="form-select mb-3" name="type"><option>Veg</option><option>Non-veg</option></select></div>
        </div>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="popular" id="popular"><label class="form-check-label" for="popular">Show on home page (popular item)</label></div>
        <div class="mb-3"><label class="form-label">Photo (under 200 KB)</label><input type="file" class="form-control" name="photo"></div>
        <button class="btn btn-m">Save item</button>
      </form>
      <!-- Items table with Edit and Delete buttons -->
      <div class="table-responsive card"><table class="table align-middle mb-0">
        <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead>
        <tbody id="itemList"></tbody>
      </table></div>
      <!-- Delete confirmation popup (Bootstrap modal). Opened by the Delete buttons above -->
      <div class="modal fade" id="del" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-body">Delete this menu item? This cannot be undone.</div>
        <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Keep item</button><button class="btn btn-danger" data-bs-dismiss="modal" onclick="confirmDelete()">Delete item</button></div>
      </div></div></div>
    </main>
  </div></div>

  <!-- Bootstrap's script file (mobile menu, tabs, popup, collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own JavaScript: makes the pages dynamic -->
  <script src="js/script.js"></script>
</body>
</html>
