<!DOCTYPE html>
<!-- Musafir restaurant website: Dashboard page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Musafir</title>
  <!-- Google Fonts: Fraunces for headings, Nunito Sans for text -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS and Bootstrap icons (from CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Our own styles (palette and small helpers) -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-admin="yes">
  <!-- ===== ADMIN TOP BAR ===== -->
  <nav class="navbar navbar-dark bg-md px-3">
    <!-- Menu button: opens the sidebar on phones -->
    <button class="btn btn-outline-light d-md-none" data-bs-toggle="offcanvas" data-bs-target="#side"><i class="bi bi-list"></i></button>
    <span class="navbar-brand mb-0">Musafir admin</span>
    <a class="btn btn-s btn-sm" href="#" onclick="adminLogout()">Log out</a>
  </nav>
  <div class="container-fluid"><div class="row">
    <!-- ===== ADMIN SIDEBAR (becomes a slide-out menu on phones) ===== -->
    <div class="offcanvas-md offcanvas-start col-md-3 col-lg-2 bg-md side p-0" id="side">
      <div class="pt-3">
        <a class=" active" href="admin-dashboard.html">Dashboard</a>
        <a class="" href="admin-menu.html">Menu items</a>
        <a class="" href="admin-reservations.html">Reservations</a>
        <a class="" href="admin-messages.html">Messages and reviews</a>
      </div>
    </div>
    <!-- ===== PAGE CONTENT ===== -->
    <main class="col-md-9 col-lg-10 p-3 p-md-4">
      <h1 class="h3 text-m mb-3">Dashboard</h1>
      <!-- Summary cards: 2 per row on phones, 4 on large screens -->
      <div class="row row-cols-2 row-cols-lg-4 g-3">
        <div class="col"><div class="card p-3"><small>Today bookings</small><span class="stat" id="statBookings">0</span></div></div>
        <div class="col"><div class="card p-3"><small>Menu items</small><span class="stat" id="statMenu">0</span></div></div>
        <div class="col"><div class="card p-3"><small>New messages</small><span class="stat" id="statMessages">0</span></div></div>
        <div class="col"><div class="card p-3"><small>Reviews</small><span class="stat" id="statReviews">0</span></div></div>
      </div>
      <!-- Recent bookings table -->
      <div class="card mt-4">
        <div class="card-header bg-white fw-semibold">Recent bookings</div>
        <div class="table-responsive"><table class="table mb-0">
          <thead><tr><th>Name</th><th>Date</th><th>Guests</th><th>Status</th></tr></thead>
          <tbody id="recentList"></tbody>
        </table></div>
      </div>
      <!-- Quick actions -->
      <div class="mt-3"><a href="admin-menu.html" class="btn btn-m">+ Add menu item</a> <a href="admin-reservations.html" class="btn btn-s">View reservations</a></div>
    </main>
  </div></div>

  <!-- Bootstrap's script file (mobile menu, tabs, popup, collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own JavaScript: makes the pages dynamic -->
  <script src="js/script.js"></script>
</body>
</html>
