<!DOCTYPE html>
<!-- Musafir restaurant website: Admin login page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login | Musafir</title>
  <!-- Google Fonts: Fraunces for headings, Nunito Sans for text -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS and Bootstrap icons (from CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Our own styles (palette and small helpers) -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- ===== ADMIN LOGIN: centered card on a dark background ===== -->
  <div class="bg-md min-vh-100 d-flex align-items-center">
    <!-- Demo admin: admin@musafir.com / admin123 (checked in js/script.js) -->
    <form class="card p-4 mx-auto" style="width:100%;max-width:340px" id="adminLoginForm">
      <h1 class="h4 text-m text-center">Admin login</h1>
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" placeholder="admin@musafir.com"  required></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" placeholder=""  required></div>
      <button class="btn btn-m">Login</button>
    </form>
  </div>

  <!-- Bootstrap's script file (mobile menu, tabs, popup, collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our own JavaScript: makes the pages dynamic -->
  <script src="js/script.js"></script>
</body>
</html>
